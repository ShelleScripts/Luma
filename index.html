<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Luma: your day, in focus. Tasks, deadlines and a planner for students.">
  <title>Luma</title>

  <!-- Set the theme before anything is drawn, so the page never flashes
       the wrong colours. js/theme.js takes over once it loads. -->
  <script>
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('luma.theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Order matters: tokens/base first, responsive overrides last -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- type="module" turns on import/export. Modules wait for the HTML to
       finish loading before they run. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">

    <!-- ===== Sidebar (desktop and tablet) ===== -->
    <nav class="side" aria-label="Main">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#8B83D9"/><circle class="brand__logo-hole" cx="11" cy="11" r="4.5"/></svg>
        <a href="#/dashboard" class="brand__name">Luma</a>
        <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Switch theme" title="Switch theme">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor"/></svg>
        </button>
      </div>

      <a class="btn btn--primary side__cta" href="#/tasks/new">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
        Add task
      </a>

      <a class="nav" href="#/dashboard" data-route="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></svg>
        Dashboard
      </a>
      <a class="nav" href="#/tasks" data-route="tasks">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><path d="M5.5 8.2l1.8 1.8 3.2-3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        My Tasks
      </a>
      <a class="nav" href="#/planner" data-route="planner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.75h11M5.5 2v3M10.5 2v3" stroke-linecap="round"/></svg>
        Planner
      </a>
      <a class="nav" href="#/deadlines" data-route="deadlines">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path d="M8 5v3.2l2 1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Deadlines
      </a>
      <a class="nav" href="#/courses" data-route="courses">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 3.5h4a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.5h4z" stroke-linejoin="round"/></svg>
        Courses
      </a>
      <!-- Milestone 5 adds a "Courses" list here, one link per course. -->

      <a class="nav side__bottom" href="#/settings" data-route="settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 5h7M12 5h1.5M2.5 11h2M7 11h6.5" stroke-linecap="round"/><circle cx="10.75" cy="5" r="1.5"/><circle cx="5.75" cy="11" r="1.5"/></svg>
        Settings
      </a>
    </nav>

    <!-- ===== Top bar (phones only) ===== -->
    <header class="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#8B83D9"/><circle class="brand__logo-hole" cx="11" cy="11" r="4.5"/></svg>
        <a href="#/dashboard" class="brand__name">Luma</a>
      </div>
      <div class="topbar__actions">
        <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Switch theme">
          <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor"/></svg>
        </button>
        <a class="icon-btn" href="#/settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 5h7M12 5h1.5M2.5 11h2M7 11h6.5" stroke-linecap="round"/><circle cx="10.75" cy="5" r="1.5"/><circle cx="5.75" cy="11" r="1.5"/></svg>
        </a>
      </div>
    </header>

    <!-- ===== Each screen is drawn in here by app.js ===== -->
    <main id="view" class="main" tabindex="-1"></main>
  </div>

  <!-- ===== Bottom tab bar + floating Add button (phones only) ===== -->
  <nav class="tabbar" aria-label="Main (mobile)">
    <a class="tabbar__link" href="#/dashboard" data-route="dashboard">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1.2"/><rect x="9" y="9" width="4.5" height="4.5" rx="1.2"/></svg>
      Home
    </a>
    <a class="tabbar__link" href="#/tasks" data-route="tasks">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><path d="M5.5 8.2l1.8 1.8 3.2-3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Tasks
    </a>
    <a class="tabbar__link" href="#/planner" data-route="planner">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.75h11M5.5 2v3M10.5 2v3" stroke-linecap="round"/></svg>
      Planner
    </a>
    <a class="tabbar__link" href="#/deadlines" data-route="deadlines">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path d="M8 5v3.2l2 1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Due
    </a>
    <a class="tabbar__link" href="#/courses" data-route="courses">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 3.5h4a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.5h4z" stroke-linejoin="round"/></svg>
      Courses
    </a>
  </nav>
  <a class="fab" href="#/tasks/new" aria-label="Add task">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
  </a>

  <!-- Toast messages appear here. aria-live makes screen readers announce them. -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
